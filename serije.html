<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Vodič — Serije</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0f18; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  .header { background: #13161f; border-bottom: 1px solid #252838; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 0.75rem 1rem; flex-wrap: wrap; }
  .header h1 { font-size: 20px; font-weight: 600; color: #fff; }
  .header h1 .glava-tip { color: #e8702a; text-transform: uppercase; }
  .glava-tip-btn { background: transparent; border: 1px solid #6e4a28; color: #e8702a; font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: all 0.15s; }
  .glava-tip-btn:hover { background: #241a10; border-color: #e8702a; }
  .now-badge { background: #e8702a; color: #fff; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; margin-left: auto; }
  .posodobljeno { font-size: 11px; color: #6a6f80; }

  .tip-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 60; display: none; }
  .tip-overlay.active { display: block; }
  .tip-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #13161f; border: 1px solid #2e3148; border-radius: 12px; padding: 20px; z-index: 61; width: min(340px, 90vw); display: none; }
  .tip-popup.active { display: block; }
  .tip-popup-naslov { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 14px; }
  .tip-popup-gumbi { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .tip-popup-gumb { padding: 10px 14px; border-radius: 8px; border: 1px solid #2e3148; background: transparent; color: #aab; font-size: 14px; cursor: pointer; text-align: left; transition: all 0.15s; }
  .tip-popup-gumb:hover { background: #1e2130; color: #fff; }
  .tip-popup-gumb.active { background: #e8702a; border-color: #e8702a; color: #fff; }
  .tip-popup-zapri { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #2e3148; background: #0f1220; color: #888; font-size: 13px; cursor: pointer; }
  .tip-popup-zapri:hover { color: #ccc; border-color: #4a4f66; }

  .filtriraj-naslov { font-size: 12px; color: #8a8f9e; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #1e2130; }
  .filtriraj-naslov .ft-tip { color: #e8702a; font-weight: 700; text-transform: uppercase; }

  .global-iskanje-bar { background: #13161f; padding: 0.75rem 1.5rem; border-bottom: 1px solid #1e2130; }
  .global-iskanje-bar .iskanje-nacin { margin-bottom: 8px; }
  .isk-prihaja-badge { position: absolute; top: 6px; right: 6px; background: #7c83ff; color: #fff; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 20px; letter-spacing: 0.5px; z-index: 2; }

  .glavni-oddelek { border-top: 3px solid; margin-top: 6px; padding-bottom: 12px; }
  .oddelek-ta-teden { border-color: #e8702a; }
  .oddelek-prihajajoci { border-color: #7c83ff; }
  .glavni-oddelek-naslov { font-size: 16px; font-weight: 700; letter-spacing: 0.4px; padding: 14px 1.5rem 8px; }
  .oddelek-ta-teden .glavni-oddelek-naslov { color: #e8702a; }
  .oddelek-prihajajoci .glavni-oddelek-naslov { color: #a9adff; }
  .poddelek-naslov { font-size: 12px; font-weight: 700; color: #b9bdca; letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 10px; }
  #top9-sekcija { background: #17120a; }
  #view-iskanje { background: #120d07; }
  #prih-top-sekcija { background: #12152a; }
  #prih-mreza-wrap { background: #0c0e1a; padding: 1.25rem 1.5rem; }

  .kanali-bar { background: #13161f; padding: 0.75rem 1.5rem; display: flex; gap: 8px; border-bottom: 1px solid #1e2130; flex-wrap: wrap; }
  .kanali-panel { background: #0f1220; padding: 0.75rem 1.5rem; gap: 8px; border-bottom: 1px solid #1e2130; flex-wrap: wrap; }
  .kanal-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid #2e3148; background: transparent; color: #888; font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .kanal-btn.active { background: #e8702a; border-color: #e8702a; color: #fff; }
  .kanal-btn:not(.active):hover { background: #1e2130; color: #ccc; }

  .dnevni-trak-bar { background: #13161f; padding: 0.75rem 1.5rem; display: flex; gap: 8px; border-bottom: 1px solid #1e2130; flex-wrap: wrap; }
  .dan-btn { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 12px; border-radius: 12px; border: 1px solid #2e3148; background: transparent; color: #888; cursor: pointer; transition: all 0.15s; line-height: 1.25; user-select: none; }
  .dan-btn:hover { background: #1e2130; color: #ccc; }
  .dan-btn.active { background: #e8702a; border-color: #e8702a; color: #fff; }
  .dan-ime { font-size: 12px; font-weight: 600; }
  .dan-datum { font-size: 10px; opacity: 0.75; }

  .main { padding: 1.5rem; }

  .filter-bar { margin-bottom: 1rem; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; min-height: 32px; }
  .filter-label { font-size: 11px; color: #555; width: 60px; flex-shrink: 0; }
  .filter-btn { padding: 5px 14px; border-radius: 20px; border: 1px solid #2e3148; background: transparent; color: #777; font-size: 12px; cursor: pointer; transition: all 0.15s; text-transform: capitalize; }
  .filter-btn:hover { background: #1e2130; color: #ccc; }
  .filter-btn.active { background: #2a3a5a; border-color: #4a6a9a; color: #8ab4f0; }

  .rezultati-info { font-size: 12px; color: #555; margin-bottom: 12px; }

  .filter-nivo2-wrap { background: #0f1220; border: 1px solid #1e2130; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; display: none; }
  .filter-nivo2-wrap.active { display: block; }
  .filter-sekcija { margin-bottom: 12px; }
  .filter-sekcija:last-child { margin-bottom: 0; }
  .filter-sekcija-label { font-size: 11px; color: #555; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .ocena-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
  .ocena-toggle-btn { padding: 4px 14px; border-radius: 20px; border: 1px solid #2e3148; background: transparent; color: #666; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .ocena-toggle-btn.active { background: #2a3a5a; border-color: #4a6a9a; color: #8ab4f0; }
  .slider-wrap { display: none; align-items: center; gap: 12px; }
  .slider-wrap.active { display: flex; }
  .slider-wrap input[type=range] { flex: 1; accent-color: #e8702a; }
  .slider-val { font-size: 13px; font-weight: 600; color: #e8702a; min-width: 50px; }
  .slider-reset { font-size: 11px; color: #555; cursor: pointer; text-decoration: underline; }
  .slider-reset:hover { color: #e8702a; }
  .iskanje-bar { background: #0f1220; border: 1px solid #1e2130; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
  .iskanje-nacin { display: flex; gap: 8px; margin-bottom: 10px; }
  .iskanje-nacin-btn { padding: 5px 16px; border-radius: 20px; border: 1px solid #2e3148; background: transparent; color: #666; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .iskanje-nacin-btn.active { background: #2a3a5a; border-color: #4a6a9a; color: #8ab4f0; }
  .iskanje-nacin-btn:hover:not(.active) { background: #1e2130; color: #ccc; }
  .iskanje-input-wrap { display: flex; gap: 8px; align-items: center; }
  .iskanje-input { flex: 1; background: #13161f; border: 1px solid #2e3148; border-radius: 6px; padding: 8px 14px; color: #e0e0e0; font-size: 13px; outline: none; transition: border-color 0.15s; }
  .iskanje-input:focus { border-color: #4a6a9a; }
  .iskanje-input::placeholder { color: #444; }
  .iskanje-clear { background: none; border: none; color: #444; font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .iskanje-clear:hover { color: #888; }
  .tip-skupina-naslov { font-size: 11px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 10px 0; padding-bottom: 6px; border-bottom: 1px solid #1e2130; }
  .tip-skupina-naslov:first-child { margin-top: 0; }

  .rezultati-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .kartica { background: #13161f; border: 1px solid #1e2130; border-radius: 8px; overflow: hidden; cursor: pointer; transition: border-color 0.15s; }
  .kartica:hover { border-color: #3a4a6a; }
  .kartica-slika { width: 100%; height: 110px; object-fit: cover; display: block; }
  .kartica-placeholder { width: 100%; height: 60px; background: #1e2130; }
  .kartica-body { padding: 10px; }
  .kartica-meta { font-size: 10px; color: #9a9dae; margin-bottom: 4px; text-transform: capitalize; }
  .kartica-naslov { font-size: 13px; font-weight: 600; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 2px; }
  .kartica-orig { font-size: 11px; color: #9a9dae; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kartica-info { font-size: 11px; color: #9a9dae; margin-top: 4px; }
  .kartica-termini { font-size: 10px; color: #e8702a; margin-top: 4px; }

  .timeline-container { overflow-x: auto; position: relative; }
  .timeline-header { display: flex; margin-left: 110px; margin-bottom: 6px; min-width: max-content; }
  .hour-tick { width: 100px; font-size: 11px; color: #444; flex-shrink: 0; border-left: 1px solid #1e2130; padding-left: 4px; }
  .timeline-row { display: flex; align-items: center; margin-bottom: 6px; min-width: max-content; }
  .row-label { width: 110px; flex-shrink: 0; padding-right: 8px; text-align: right; }
  .rl-dan { font-size: 13px; font-weight: 600; color: #ccc; }
  .rl-datum { font-size: 11px; color: #555; }
  .row-track { position: relative; height: 64px; background: #13161f; border-radius: 6px; width: 2400px; overflow: hidden; border: 1px solid #1e2130; }
  .oddaja-blok { position: absolute; top: 3px; bottom: 3px; border-radius: 5px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; padding: 0 8px; overflow: hidden; transition: filter 0.15s; border: 1px solid transparent; }
  .oddaja-blok:hover { filter: brightness(1.2); border-color: rgba(255,255,255,0.2); z-index: 2; }
  .b-cas { font-size: 10px; color: rgba(255,255,255,0.45); white-space: nowrap; }
  .b-naslov { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b-zanr { font-size: 10px; color: rgba(255,255,255,0.4); white-space: nowrap; text-transform: capitalize; }
  .zanr-akcija { background: #1a2a4a; }
  .zanr-drama { background: #2a1a3a; }
  .zanr-komedija { background: #1a3a1a; }
  .zanr-triler { background: #2a2a1a; }
  .zanr-grozljivka { background: #3a1a1a; }
  .zanr-romantični { background: #3a1a2a; }
  .zanr-dokumentarni { background: #1a2a2a; }
  .zanr-serija { background: #1a2a3a; }
  .zanr-drugo { background: #1e2130; }
  .now-line { position: absolute; top: 0; bottom: 0; width: 2px; background: #e8702a; z-index: 5; pointer-events: none; }
  .now-line-label { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #e8702a; white-space: nowrap; background: #0d0f18; padding: 1px 4px; }
  .row-separator { height: 1px; background: #1a1d28; margin: 4px 0 4px 110px; width: 2400px; }
  .ni-podatkov-row { height: 64px; display: flex; align-items: center; padding-left: 12px; font-size: 12px; color: #333; font-style: italic; }
  .legenda { display: flex; gap: 16px; margin-top: 1.5rem; flex-wrap: wrap; }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; }
  .leg-dot { width: 12px; height: 12px; border-radius: 3px; }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; }
  .overlay.active { display: block; }
  .popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #13161f; border: 1px solid #2e3148; border-radius: 12px; padding: 1.5rem; width: 500px; max-width: 95vw; max-height: 85vh; overflow-y: auto; z-index: 51; }
  .popup.active { display: block; }
  .popup-close { position: absolute; top: 10px; right: 10px; z-index: 5; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.25); color: #fff; font-size: 20px; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; line-height: 1; cursor: pointer; }
  .popup-close:hover { background: rgba(0,0,0,0.85); color: #fff; }
  .popup-slika { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 1rem; cursor: zoom-in; position: relative; display: block; }
  .popup-slika-wrap { position: relative; }
  .popup-slika-zoom-hint { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.55); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; pointer-events: none; }
  .slika-lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; cursor: zoom-out; }
  .slika-lightbox.active { display: flex; }
  .slika-lightbox img { max-width: 92vw; max-height: 92vh; object-fit: contain; border-radius: 8px; }
  .slika-lightbox-close { position: absolute; top: 16px; right: 20px; background: none; border: none; color: #fff; font-size: 32px; cursor: pointer; line-height: 1; }
  .popup-zanr-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: #1e2130; color: #888; margin-bottom: 8px; text-transform: capitalize; }
  .popup h2 { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .popup .orig-naslov { font-size: 13px; color: #555; margin-bottom: 8px; font-style: italic; }
  .popup-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .popup-meta span { font-size: 12px; color: #777; background: #1a1d28; padding: 3px 10px; border-radius: 20px; }
  .popup-opis { font-size: 13px; color: #aaa; line-height: 1.7; margin-bottom: 1rem; }
  .popup-termini-naslov { font-size: 11px; font-weight: 600; color: #555; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .termin-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #1a1d28; border-radius: 6px; margin-bottom: 6px; font-size: 12px; flex-wrap: wrap; }
  .termin-kanal { color: #e8702a; font-weight: 600; min-width: 90px; }
  .termin-datum { color: #888; }
  .termin-cas { color: #ccc; font-weight: 600; }
  .termin-trajanje { color: #555; margin-left: auto; }

  /* ===== Top 9 pas ===== */
  .top9-sekcija { padding: 1.25rem 1.5rem 0.25rem; }
  .top9-glava { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .top9-naslov { font-size: 14px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .top9-caret { font-size: 10px; color: #e8702a; transition: transform 0.15s; }
  .top9-sekcija.zvito .top9-caret { transform: rotate(-90deg); }
  .top9-sekcija.zvito .top9-grid { display: none; }
  .top9-podnaslov { font-size: 11px; color: #555; font-weight: 400; margin-left: 4px; }
  .top9-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (min-width: 760px) { .top9-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); } }
  .top9-akcija { text-align: center; margin-top: 14px; }
  .top9-sekcija.zvito .top9-akcija { display: none; }
  .top9-kartica { position: relative; background: #13161f; border: 1px solid #1e2130; border-radius: 8px; overflow: hidden; cursor: pointer; transition: border-color 0.15s, transform 0.15s; }
  .top9-kartica:hover { border-color: #e8702a; transform: translateY(-2px); }
  .top9-slika { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #1e2130; }
  .top9-badge { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.75); color: #f5c518; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 20px; }
  .top9-naslov-k { font-size: 11px; font-weight: 600; color: #fff; padding: 6px 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ===== Gumb "Prikaži vse filme" + placeholder ===== */
  .prikazi-vse-btn { padding: 8px 20px; border-radius: 22px; border: 1px solid #e8702a; background: #e8702a; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .prikazi-vse-btn:hover { background: #d5641f; border-color: #d5641f; }
  .mreza-placeholder { text-align: center; padding: 2.5rem 1rem; }
  .prikazi-vse-btn.velik { padding: 12px 28px; font-size: 14px; }

  /* ===== Paginacija ===== */
  .paginacija { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 1.5rem; flex-wrap: wrap; }
  .pag-btn { padding: 7px 16px; border-radius: 20px; border: 1px solid #2e3148; background: transparent; color: #aaa; font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .pag-btn:hover:not(:disabled) { background: #1e2130; color: #fff; }
  .pag-btn:disabled { opacity: 0.35; cursor: default; }
  .pag-info { font-size: 12px; color: #666; min-width: 90px; text-align: center; }

  /* ===== Nalaganje (overlay pod glavo) ===== */
  .nalaganje { position: fixed; left: 0; right: 0; bottom: 0; top: 56px; background: #0d0f18; z-index: 40; display: flex; align-items: center; justify-content: center; }
  .nalaganje.skrito { display: none; }
  .nalaganje-box { text-align: center; padding: 0 1.5rem; }
  .nalaganje-spinner { width: 44px; height: 44px; border: 4px solid #1e2130; border-top-color: #e8702a; border-radius: 50%; margin: 0 auto 16px; animation: nal-spin 0.9s linear infinite; }
  @keyframes nal-spin { to { transform: rotate(360deg); } }
  .nalaganje-tekst { font-size: 15px; font-weight: 600; color: #fff; }
  .nalaganje-podtekst { font-size: 12px; color: #777; margin-top: 6px; }

  /* Vrsta vsebine, ki ima svojo stran (Šport) — v popupu je povezava, ne filter. */
  a.tip-popup-gumb { display: block; text-decoration: none; }
  .tip-popup-veja { border-color: #2a5c40; color: #4fd18a; }
  .tip-popup-veja:hover { background: #10281c; color: #6fe0a0; }
  .tip-popup-veja::after { content: '↗'; float: right; opacity: 0.6; }

  /* ===========================================================================
     IZBORNIK VSEBIN v glavi — skupen za vse strani
     ===========================================================================
     Barvni gumbi = veje s svojo stranjo, vsak v barvi svoje veje. Sivi napisi =
     vrste, ki živijo kot filter na filmski strani. Vrstica NI lepljiva
     (Andrejeva zahteva 22.8.2026): na telefonu bi lebdeča pojedla preveč
     zaslona, zato odplava skupaj s stranjo.
     ======================================================================== */

  #veje-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .vn { font-size: 13px; font-weight: 700; letter-spacing: 0.6px; padding: 6px 15px;
        border-radius: 18px; border: 1px solid; text-decoration: none; white-space: nowrap;
        transition: all 0.15s; }
  .vn-filmi  { color: #e8702a; border-color: #e8702a55; background: #e8702a12; }
  .vn-serije { color: #c9aef5; border-color: #7a4fd055; background: #7a4fd018; }
  .vn-sport  { color: #4fd18a; border-color: #1fa25a55; background: #1fa25a15; }
  .vn-filmi:hover  { border-color: #e8702a; background: #e8702a25; }
  .vn-serije:hover { border-color: #7a4fd0; background: #7a4fd030; }
  .vn-sport:hover  { border-color: #1fa25a; background: #1fa25a28; }
  .vn.aktiven { color: #fff; }
  .vn-filmi.aktiven  { background: #e8702a; border-color: #e8702a; }
  .vn-serije.aktiven { background: #7a4fd0; border-color: #7a4fd0; }
  .vn-sport.aktiven  { background: #1fa25a; border-color: #1fa25a; }

  .vn-locnica { width: 1px; height: 20px; background: #2a2e3d; margin: 0 3px; }
  .vn-oznaka { font-size: 11px; color: #5f6474; white-space: nowrap; }

  .vn-vrsta { font-size: 12px; padding: 5px 11px; border-radius: 16px;
              border: 1px dashed #2e3148; color: #6f6a86; text-decoration: none;
              white-space: nowrap; transition: all 0.15s; }
  .vn-vrsta:hover { color: #ddd; border-color: #555; border-style: solid; }
  .vn-vrsta.aktiven { color: #fff; border-style: solid; border-color: #e8702a;
                      background: #e8702a22; }

  /* Ura in "osveženo" gresta na desni rob glave. */

<script>
/* =============================================================================
   IZBORNIK VSEBIN — skupen del vseh strani portala
   =============================================================================
   Vrstica v glavi: barvni gumbi za veje, ki imajo SVOJO stran (FILMI, SERIJE,
   ŠPORT), za njimi pa sivi napisi za vrste, ki svoje strani še nimajo in živijo
   kot filter na filmski strani (Dokumentarci, Otroški/Mladinski, Informativni …).

   Zakaj je to skupna datoteka in ne trikrat prepisana koda: seznam vej se bo
   spreminjal (dokumentarci so naslednji na vrsti) in trije izvodi bi se
   neizogibno razšli. `zgradi.py` jo vključi v vse tri strani.

   Seznam pride iz `veje/vrste.json` — edinega vira resnice o tem, katere vrste
   obstajajo in katera stran jih pokaže. Ko dokumentarci dobijo svojo vejo, se
   njihov napis SAM premakne izmed sivih med barvne; tu ni česa popravljati.

   NADOMESTIL JE GUMB "Izberi drugo TV vsebino" (22.8.2026). Dve poti do iste
   stvari sta bili razlog, da je bila prejšnja vrstica zavihkov avgusta
   odstranjena — zato je zdaj gumb odstranjen, ne vrstica.

   Na filmski strani preklop med sivimi vrstami NE pomeni nalaganja strani:
   filmska stran ima podatke že v pomnilniku (~11 MB), zato se kliče `izberTip`
   in se filtrira na mestu. Z drugih strani je to navadna povezava z `?tip=`.
   ========================================================================== */

const VEJA_AKTIVNA = 'serije';

// Vrstni red barvnih gumbov. Kar ni na seznamu, se doda na konec — nova veja
// se torej pokaže tudi, če tega seznama nihče ne posodobi.
const VEJE_VRSTNI_RED = ['filmi', 'serije', 'sport'];

const VEJE_IMENA = { filmi: 'FILMI' };   // vrste.json to vejo pozna kot "Film"

// Uradna imena kategorij iz EPG so za gumb predolga ("Dokumentarni program").
// Povezava in filter uporabljata še vedno pravo ime; skrajšano je samo, kar
// uporabnik prebere.
const KRATKA_IMENA = {
  'Dokumentarni program': 'Dokumentarci',
  'Informativni program': 'Informativni',
  'Razvedrilni program':  'Razvedrilni',
  'Otroški/Mladinski':    'Otroški',
};

// Vrstni red sivih napisov je vrstni red načrta (dokumentarci so naslednja veja
// na vrsti), ne pogostost v sporedu. Kar ni na seznamu, gre na konec.
const VRSTE_VRSTNI_RED = ['Dokumentarni program', 'Otroški/Mladinski',
                          'Informativni program', 'Razvedrilni program'];

function _vnUbegni(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* vrste        — vsebina veje/vrste.json (polje "vrste")
   aktivniTip   — samo filmska stran: katera vrsta je trenutno izbrana
   filmskiTipi  — samo filmska stran: vrste, ki v podatkih res obstajajo      */
function izrisiVejeNav(vrste, aktivniTip, filmskiTipi) {
  const cilj = document.getElementById('veje-nav');
  if (!cilj) return;
  vrste = vrste || [];

  // --- barvni gumbi: veje s svojo stranjo ---
  const veje = [];
  const videne = new Set();
  vrste.forEach(v => {
    const kljuc = v.veja || 'filmi';
    if (videne.has(kljuc)) return;
    // Filmsko vejo zastopa privzeta vrsta (Film); ostale vrste filmske strani
    // niso veje, ampak filtri, in gredo med sive napise.
    if (kljuc === 'filmi' && !v.privzeta) return;
    videne.add(kljuc);
    veje.push({ kljuc, ime: VEJE_IMENA[kljuc] || v.ime.toUpperCase(), stran: v.stran });
  });
  veje.sort((a, b) => {
    const ia = VEJE_VRSTNI_RED.indexOf(a.kljuc), ib = VEJE_VRSTNI_RED.indexOf(b.kljuc);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  // --- sivi napisi: vrste filmske strani brez privzete ---
  let sive = vrste.filter(v => (v.veja || 'filmi') === 'filmi' && !v.privzeta)
                  .map(v => v.ime);
  // Filmska stran ve bolje od štetja v vrste.json, katere vrste po združevanju
  // ponovitev sploh ostanejo; kadar ta seznam pošlje, ima prednost.
  if (filmskiTipi) sive = sive.filter(t => filmskiTipi.includes(t));
  sive.sort((a, b) => {
    const ia = VRSTE_VRSTNI_RED.indexOf(a), ib = VRSTE_VRSTNI_RED.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  const naStrani = VEJA_AKTIVNA === 'filmi';
  cilj.innerHTML =
    veje.map(v => {
      const aktiven = v.kljuc === VEJA_AKTIVNA &&
        !(naStrani && aktivniTip && sive.includes(aktivniTip));
      return `<a class="vn vn-${v.kljuc}${aktiven ? ' aktiven' : ''}" href="${_vnUbegni(v.stran)}">${_vnUbegni(v.ime)}</a>`;
    }).join('') +
    (sive.length
      ? `<span class="vn-locnica"></span><span class="vn-oznaka">v pripravi:</span>` +
        sive.map(t => {
          const aktiven = naStrani && t === aktivniTip ? ' aktiven' : '';
          // Na filmski strani je to preklop na mestu (podatki so že naloženi),
          // drugod navadna povezava. href ostane v obeh primerih — deluje tudi,
          // če JavaScript odpove ali če uporabnik odpre v novem zavihku.
          return `<a class="vn-vrsta${aktiven}" data-tip="${_vnUbegni(t)}"
                     href="index.html?tip=${encodeURIComponent(t)}"
                     title="${_vnUbegni(t)}">${_vnUbegni(KRATKA_IMENA[t] || t)}</a>`;
        }).join('')
      : '');

  if (naStrani && typeof izberTip === 'function') {
    cilj.querySelectorAll('.vn-vrsta').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        izberTip(a.dataset.tip);
      });
    });
  }
}

/* =============================================================================
   SERIJSKA VEJA — serije.html
   =============================================================================
   Bere veje/serije.json (serije + epizode + termini) in izriše mrežo serij.

   KLJUČNA RAZLIKA GLEDE NA DRUGI DVE VEJI:
   Filmi so naslov-centrični (en film, več terminov), šport dogodek-centričen
   (kronološki seznam). Serije so HIERARHIČNE: serija -> sezona -> epizoda ->
   termini. Serija se na strani pojavi natanko enkrat, ne glede na to, kolikokrat
   je čez teden na sporedu — vse ostalo je v popupu.

   SEZONE NISO V PODATKIH:
   veje/serije.json ima samo serije, epizode in termine. Sezona je izpeljana iz
   številke epizode ob izrisu; tako je nemogoče, da bi se seznam sezon razšel s
   tem, kar je dejansko na sporedu.

   STATUS SE RAČUNA TUKAJ, NE V PODATKIH:
   "je bilo / je zdaj / bo" je lastnost trenutka. V datoteki so samo dejstva
   (zac, kon, prvi, zacetek); oznake nastanejo ob izrisu in se osvežijo vsakih
   30 s. Datoteka, stara tri ure, je zato še vedno pravilna.

   IZVIRNI NASLOV JE GLAVNI (Andrejevo pravilo 22.8.2026): slovenski je podnaslov
   in dodatna beseda za iskalnik, nikoli nadomestek.
   ========================================================================== */

const PODATKI = '';
const OSVEZI_MS = 30 * 1000;    // kako pogosto se preračunajo statusi
const NA_STRAN = 15;            // serij na stran (enako kot filmska mreža)
const ZACETKOV = 15;            // koliko prihodnjih kartic v pasu "Začni gledati"
const ZACETKOV_ARHIV = 10;      // koliko preteklih (že predvajanih) kartic
const SE_ZAMUDA = 30 * 60;      // sekund po začetku, ko epizoda še šteje za "zdaj"

const DNEVI_SL = ['Nedelja', 'Ponedeljek', 'Torek', 'Sreda', 'Četrtek', 'Petek', 'Sobota'];
const MESECI = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'avg', 'sep', 'okt', 'nov', 'dec'];

let SERIJE = {};
let EPIZODE = {};
let TERMINI = [];
let META = {};
let VRSTE = [];

// Izpeljani indeksi (zgrajeni enkrat ob nalaganju)
let TERMINI_EP = {};     // eid  -> [termini], kronološko
let EPIZODE_SER = {};    // sid  -> [eid]
let TERMINI_SER = {};    // sid  -> [termini], kronološko

let izbraniKanali = new Set();
let izbraniZanri = new Set();
let ocenaFilter = 'vse';
let razvrstitev = 'ocena';
let query = '';
let stranIdx = 0;
let odprtaSerija = null;
let odprteSezone = new Set();
let tikTimer = null;

// -----------------------------------------------------------------------------
// Pomožne
// -----------------------------------------------------------------------------

function zdaj() { return Math.floor(Date.now() / 1000); }
function dvomestno(n) { return n < 10 ? '0' + n : '' + n; }

function uraIz(ts) {
  const d = new Date(ts * 1000);
  return dvomestno(d.getHours()) + ':' + dvomestno(d.getMinutes());
}

function danesStr() {
  const d = new Date();
  return d.getFullYear() + '-' + dvomestno(d.getMonth() + 1) + '-' + dvomestno(d.getDate());
}

function imeDneva(datum) {
  const danes = danesStr();
  if (datum === danes) return 'Danes';
  const j = new Date(); j.setDate(j.getDate() + 1);
  const jutri = j.getFullYear() + '-' + dvomestno(j.getMonth() + 1) + '-' + dvomestno(j.getDate());
  if (datum === jutri) return 'Jutri';
  return DNEVI_SL[new Date(datum + 'T12:00:00').getDay()];
}

function datumKratko(datum) {
  const d = new Date(datum + 'T12:00:00');
  return d.getDate() + '. ' + MESECI[d.getMonth()];
}

function odstevanje(sekund) {
  if (sekund < 60) return 'vsak hip';
  const m = Math.floor(sekund / 60), h = Math.floor(m / 60), dni = Math.floor(h / 24);
  if (dni > 0) return 'čez ' + dni + ' d ' + (h % 24) + ' h';
  if (h > 0) return 'čez ' + h + ' h ' + (m % 60) + ' min';
  return 'čez ' + m + ' min';
}

/* Plakat s TMDb lahko izgine (serija se preimenuje, slika umakne). Prazen
   okvir v mreži je videti kot okvara strani, zato ga zamenja nadomestek. */
function slikaNiUspela(img) {
  img.onerror = null;
  const nadomestek = document.createElement('div');
  nadomestek.className = img.classList.contains('se-kartica-slika') ? 'se-kartica-brez' : 'se-zacetek-plakat';
  if (nadomestek.className === 'se-kartica-brez') nadomestek.textContent = '📺';
  img.replaceWith(nadomestek);
}

/* Koliko časa nazaj je bilo. Namenoma brez ur — pri arhivu je natančnost na
   minuto nepomembna, dan pa je tisto, kar si gledalec zapomni. */
function predDnevi(sekund) {
  const dni = Math.floor(sekund / 86400);
  if (dni <= 0) return 'danes';
  if (dni === 1) return 'včeraj';
  return 'pred ' + dni + ' dnevi';
}

function ubegni(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* Oznaka epizode: S8E12. Epizode brez oznake v EPG (redke) je nimajo. */
function oznakaEpizode(e) {
  if (e.s == null || e.e == null) return '';
  return 'S' + e.s + 'E' + e.e;
}

// -----------------------------------------------------------------------------
// STATUS — edino mesto, kjer se odloča, kaj je kaj
// -----------------------------------------------------------------------------

function statusTermina(t) {
  const n = zdaj();
  if (n < t.zac) return 'bo';
  if (n <= Math.max(t.kon, t.zac + SE_ZAMUDA)) return 'zdaj';
  return 'bilo';
}

/* Prvi termin serije, ki še ni mimo. Vrne null, če je vse za nami. */
function naslednjiTermin(sid) {
  const n = zdaj();
  return (TERMINI_SER[sid] || []).find(t => t.kon >= n) || null;
}

function terminOpis(t) {
  return imeDneva(t.datum) + ' ' + uraIz(t.zac) + ' · ' + t.k;
}

// -----------------------------------------------------------------------------
// Nalaganje
// -----------------------------------------------------------------------------

async function init() {
  try {
    const glava = document.querySelector('.header');
    const ov = document.getElementById('nalaganje');
    if (glava && ov) ov.style.top = glava.offsetHeight + 'px';

    try {
      const rv = await fetch(PODATKI + 'veje/vrste.json');
      if (rv.ok) VRSTE = (await rv.json()).vrste || [];
    } catch (e) { VRSTE = []; }
    izrisiVejeNav(VRSTE);

    const resp = await fetch(PODATKI + 'veje/serije.json');
    if (!resp.ok) throw new Error('serije.json ni dosegljiv (' + resp.status + ')');
    const d = await resp.json();
    SERIJE = d.serije || {};
    EPIZODE = d.epizode || {};
    TERMINI = d.termini || [];
    META = d;

    zgradiIndekse();

    const p = document.getElementById('posodobljeno-txt');
    if (p) p.textContent = 'osveženo ' + (d.posodobljeno || '');

    izrisiFiltre();
    osveziVse();
    tikTimer = setInterval(tik, OSVEZI_MS);
  } catch (e) {
    console.error('Napaka pri nalaganju serij:', e);
    document.getElementById('se-mreza').innerHTML =
      '<div class="se-prazno">Serij ni bilo mogoče naložiti.<br>' + ubegni(e.message) + '</div>';
  } finally {
    skrijNalaganje();
  }
}

/* Termini so v datoteki že kronološki; indeksi to lastnost ohranijo, zato
   nikjer kasneje ni treba sortirati. */
function zgradiIndekse() {
  TERMINI_EP = {}; EPIZODE_SER = {}; TERMINI_SER = {};
  Object.keys(EPIZODE).forEach(eid => {
    const sid = EPIZODE[eid].serija;
    (EPIZODE_SER[sid] = EPIZODE_SER[sid] || []).push(eid);
  });
  TERMINI.forEach(t => {
    (TERMINI_EP[t.ep] = TERMINI_EP[t.ep] || []).push(t);
    const e = EPIZODE[t.ep];
    if (e) (TERMINI_SER[e.serija] = TERMINI_SER[e.serija] || []).push(t);
  });
}

function skrijNalaganje() {
  const n = document.getElementById('nalaganje');
  if (n) n.classList.add('skrito');
}

function tik() {
  izrisiZacetke();
  izrisiMrezo();
  posodobiUro();
}

function osveziVse() {
  izrisiZacetke();
  izrisiMrezo();
  posodobiUro();
}

function posodobiUro() {
  const el = document.getElementById('now-time');
  if (el) {
    const d = new Date();
    el.textContent = dvomestno(d.getHours()) + ':' + dvomestno(d.getMinutes());
  }
}

// -----------------------------------------------------------------------------
// Pas: ZAČNI GLEDATI
// -----------------------------------------------------------------------------
/* Prve epizode (S01E01 = začetek serije, E01 = začetek sezone) so za gledalca
   edina mesta, kjer se je smiselno vključiti. Oznaka `zacetek` je v podatkih;
   tukaj se odloči le, katere so še pred nami. */

function zacetkiZaPas() {
  const n = zdaj();
  const prihaja = [], arhiv = [];
  Object.keys(EPIZODE).forEach(eid => {
    const e = EPIZODE[eid];
    if (!e.zacetek) return;
    const t = (TERMINI_EP[eid] || []).find(x => x.kon >= n);
    if (t) {
      prihaja.push({ eid, e, t, vrsta: 'prihaja' });
      return;
    }
    // Že predvajano. Vzame se ZADNJI termin — ta je v arhivu najsvežji in bo
    // iz njega tudi zadnji izpadel.
    const zadnji = (TERMINI_EP[eid] || []).reduce(
      (naj, x) => (!naj || x.zac > naj.zac) ? x : naj, null);
    if (zadnji) arhiv.push({ eid, e, t: zadnji, vrsta: 'arhiv' });
  });

  // Arhivske gredo naprej, NAJSVEŽEJŠA spredaj. Nasprotno od intuicije "najprej
  // tisto, kar bo najprej izginilo": ker arhiv vsakega ponudnika traja drugače,
  // je pri najstarejših najmanj verjetno, da so še na voljo — obljubljali bi
  // nekaj, česar ni. Najsvežejša epizoda je tista, ki jo gledalec skoraj gotovo
  // še ujame. Za njimi prihodnje, kronološko.
  arhiv.sort((a, b) => b.t.zac - a.t.zac);
  prihaja.sort((a, b) => a.t.zac - b.t.zac);
  return arhiv.slice(0, ZACETKOV_ARHIV).concat(prihaja.slice(0, ZACETKOV));
}

function izrisiZacetke() {
  const sek = document.getElementById('zacetki-sekcija');
  const vrsta = document.getElementById('zacetki-vrsta');
  const seznam = zacetkiZaPas();

  if (!seznam.length) { sek.style.display = 'none'; return; }
  sek.style.display = '';

  const n = zdaj();
  vrsta.innerHTML = seznam.map(({ e, t, vrsta: kaj }) => {
    const s = SERIJE[e.serija] || {};
    const prva = e.zacetek === 'serija';
    const plakat = s.poster_tmdb || s.slika || '';
    const arhiv = kaj === 'arhiv';
    // Pri arhivskih piše SAMO, kdaj je bilo. Ne koliko časa je še na voljo
    // (naši podatki so iz enega ponudnika, gledalec je lahko pri drugem) in
    // brez napotkov, kje naj išče — to uporabnik ve sam. (Andrej, 22.8.2026.)
    // "Danes 06:25 ... danes" je odveč — vrstica z dnevom to že pove. Starost
    // se izpiše samo takrat, ko pove kaj novega (dva dni ali več).
    const starost = predDnevi(n - t.zac);
    const spodaj = arhiv
      ? (starost === 'danes' || starost === 'včeraj' ? ''
         : `<span class="se-zacetek-arh">${starost}</span>`)
      : `<span class="se-zacetek-cd">${odstevanje(Math.max(0, t.zac - n))}</span>`;
    return `<div class="se-zacetek${arhiv ? ' arhiv' : ''}" onclick="odpriPopup('${e.serija}', ${e.s})">
      ${plakat ? `<img class="se-zacetek-plakat" src="${ubegni(plakat)}" alt="" loading="lazy" onerror="slikaNiUspela(this)">`
               : '<div class="se-zacetek-plakat"></div>'}
      <div class="se-zacetek-telo">
        <span class="se-zacetek-oznaka ${prva ? 'prva' : ''}">${prva ? 'Prva epizoda' : 'Sezona ' + e.s}</span>
        <div class="se-zacetek-naslov">${ubegni(s.naslov || '')}</div>
        ${s.naslov_sl ? `<div class="se-zacetek-sl">${ubegni(s.naslov_sl)}</div>` : ''}
        <div class="se-zacetek-meta">
          ${imeDneva(t.datum)} ${uraIz(t.zac)} · ${ubegni(t.k)}<br>
          ${spodaj}
        </div>
      </div>
    </div>`;
  }).join('');
}

// -----------------------------------------------------------------------------
// Filtri
// -----------------------------------------------------------------------------

const RAZVRSTITVE = [
  ['ocena', 'Najboljše ocenjene'],
  ['kmalu', 'Kmalu na sporedu'],
  ['abeceda', 'Po abecedi'],
  ['epizod', 'Največ epizod'],
];

const OCENE = [
  ['vse', 'Vse'],
  ['8', 'IMDb 8+'],
  ['7', 'IMDb 7+'],
  ['brez', 'Brez ocene'],
];

function izrisiFiltre() {
  document.getElementById('f-razvrsti').innerHTML = RAZVRSTITVE.map(([k, t]) =>
    `<button class="se-btn ${razvrstitev === k ? 'active' : ''}" onclick="nastaviRazvrstitev('${k}')">${t}</button>`
  ).join('');

  document.getElementById('f-ocena').innerHTML = OCENE.map(([k, t]) =>
    `<button class="se-btn ${ocenaFilter === k ? 'active' : ''}" onclick="nastaviOceno('${k}')">${t}</button>`
  ).join('');

  const kan = META.kanali || [];
  document.getElementById('f-kanal').innerHTML =
    `<button class="se-btn ${izbraniKanali.size === 0 ? 'active' : ''}" onclick="pocistiKanale()">Vsi kanali</button>` +
    kan.map(k => `<button class="se-btn ${izbraniKanali.has(k.ime) ? 'active' : ''}"
        onclick="preklopiKanal('${ubegni(k.ime)}')">${ubegni(k.ime)}<span class="se-btn-stevec">${k.serij}</span></button>`
    ).join('');

  const zanri = (META.zanri || []).filter(z => z.ime);
  document.getElementById('f-zanr').innerHTML =
    `<button class="se-btn ${izbraniZanri.size === 0 ? 'active' : ''}" onclick="pocistiZanre()">Vsi žanri</button>` +
    zanri.map(z => `<button class="se-btn ${izbraniZanri.has(z.ime) ? 'active' : ''}"
        onclick="preklopiZanr('${ubegni(z.ime)}')">${ubegni(z.ime)}<span class="se-btn-stevec">${z.serij}</span></button>`
    ).join('');
}

function nastaviRazvrstitev(k) { razvrstitev = k; stranIdx = 0; izrisiFiltre(); izrisiMrezo(); }
function nastaviOceno(k) { ocenaFilter = k; stranIdx = 0; izrisiFiltre(); izrisiMrezo(); }
function pocistiKanale() { izbraniKanali.clear(); stranIdx = 0; izrisiFiltre(); izrisiMrezo(); }
function preklopiKanal(k) {
  izbraniKanali.has(k) ? izbraniKanali.delete(k) : izbraniKanali.add(k);
  stranIdx = 0; izrisiFiltre(); izrisiMrezo();
}
function pocistiZanre() { izbraniZanri.clear(); stranIdx = 0; izrisiFiltre(); izrisiMrezo(); }
function preklopiZanr(z) {
  izbraniZanri.has(z) ? izbraniZanri.delete(z) : izbraniZanri.add(z);
  stranIdx = 0; izrisiFiltre(); izrisiMrezo();
}

function onIskanje() {
  query = document.getElementById('se-iskanje').value.trim().toLowerCase();
  document.getElementById('se-iskanje-clear').style.display = query ? '' : 'none';
  stranIdx = 0;
  izrisiMrezo();
}

function pocistiIskanje() {
  document.getElementById('se-iskanje').value = '';
  query = '';
  document.getElementById('se-iskanje-clear').style.display = 'none';
  stranIdx = 0;
  izrisiMrezo();
}

// -----------------------------------------------------------------------------
// Mreža serij
// -----------------------------------------------------------------------------

/* Iskanje gre čez izvirni naslov, slovenskega, naslov s TMDb in čez naslove
   epizod — kdor se spomni samo epizode ("Striptizeta"), mora najti serijo. */
function besediloSerije(sid) {
  const s = SERIJE[sid];
  const deli = [s.naslov, s.naslov_sl, s.naslov_tmdb, (s.zanr || []).join(' '),
                (s.kanali || []).join(' '), s.opis || ''];
  (EPIZODE_SER[sid] || []).forEach(eid => {
    const e = EPIZODE[eid];
    deli.push(e.naslov, e.naslov_sl);
  });
  return deli.join(' ').toLowerCase();
}

function ustreza(sid) {
  const s = SERIJE[sid];
  if (izbraniKanali.size && !(s.kanali || []).some(k => izbraniKanali.has(k))) return false;
  if (izbraniZanri.size && !(s.zanr || []).some(z => izbraniZanri.has(z))) return false;

  const ocena = parseFloat(s.imdb_ocena);
  if (ocenaFilter === 'brez' && !isNaN(ocena)) return false;
  if (ocenaFilter === '8' && !(ocena >= 8)) return false;
  if (ocenaFilter === '7' && !(ocena >= 7)) return false;

  if (query && !besediloSerije(sid).includes(query)) return false;
  return true;
}

function urejeneSerije() {
  const seznam = Object.keys(SERIJE).filter(ustreza);
  const kljuc = {
    ocena: sid => -(parseFloat(SERIJE[sid].imdb_ocena) || 0),
    epizod: sid => -(SERIJE[sid].epizod || 0),
    abeceda: sid => SERIJE[sid].naslov.toLowerCase(),
    kmalu: sid => { const t = naslednjiTermin(sid); return t ? t.zac : Infinity; },
  }[razvrstitev];

  return seznam.sort((a, b) => {
    const ka = kljuc(a), kb = kljuc(b);
    if (ka < kb) return -1;
    if (ka > kb) return 1;
    return SERIJE[a].naslov.localeCompare(SERIJE[b].naslov, 'sl');
  });
}

function izrisiMrezo() {
  const seznam = urejeneSerije();
  const info = document.getElementById('se-info');
  const cilj = document.getElementById('se-mreza');
  const strani = Math.max(1, Math.ceil(seznam.length / NA_STRAN));
  if (stranIdx >= strani) stranIdx = strani - 1;

  info.textContent = seznam.length + (seznam.length === 1 ? ' serija' : ' serij') +
    ' · ' + TERMINI.length + ' terminov v oknu';

  if (!seznam.length) {
    cilj.innerHTML = '<div class="se-prazno">Za izbrane filtre ni serij.</div>';
    document.getElementById('se-paginacija').style.display = 'none';
    return;
  }

  const odsek = seznam.slice(stranIdx * NA_STRAN, (stranIdx + 1) * NA_STRAN);
  cilj.innerHTML = odsek.map(karticaHtml).join('');

  const pag = document.getElementById('se-paginacija');
  pag.style.display = strani > 1 ? '' : 'none';
  document.getElementById('pag-info').textContent = `${stranIdx + 1} / ${strani}`;
  document.getElementById('pag-prej').disabled = stranIdx === 0;
  document.getElementById('pag-nasl').disabled = stranIdx >= strani - 1;
}

function stran(korak) {
  stranIdx += korak;
  izrisiMrezo();
  window.scrollTo({ top: document.querySelector('.main').offsetTop - 10, behavior: 'smooth' });
}

/* Ali serija v prihodnje ponuja začetek sezone ali serije — to je edina oznaka
   na kartici, ker je za gledalca najbolj uporabna informacija. */
function zacetekVPrihodnje(sid) {
  const n = zdaj();
  let najboljsi = null;
  (EPIZODE_SER[sid] || []).forEach(eid => {
    const e = EPIZODE[eid];
    if (!e.zacetek) return;
    if (!(TERMINI_EP[eid] || []).some(t => t.kon >= n)) return;
    if (e.zacetek === 'serija' || !najboljsi) najboljsi = e.zacetek;
  });
  return najboljsi;
}

function karticaHtml(sid) {
  const s = SERIJE[sid];
  const plakat = s.poster_tmdb || s.slika || '';
  const ocena = s.imdb_ocena ? `<span class="se-kartica-ocena">★ ${ubegni(s.imdb_ocena)}</span>` : '';
  const zac = zacetekVPrihodnje(sid);
  const znak = zac
    ? `<span class="se-kartica-znak">${zac === 'serija' ? 'OD ZAČETKA' : 'NOVA SEZONA'}</span>` : '';
  const sezone = (s.sezone || []);
  const sezOpis = sezone.length === 0 ? ''
    : sezone.length === 1 ? 'sezona ' + sezone[0]
      : 'sezone ' + sezone[0] + '–' + sezone[sezone.length - 1];
  const t = naslednjiTermin(sid);
  const naslednji = t
    ? `<div class="se-kartica-nasl-termin">${imeDneva(t.datum)} ${uraIz(t.zac)} · ${ubegni(t.k)}</div>`
    : '<div class="se-kartica-nasl-termin" style="color:#5c5870">ni več na sporedu</div>';

  return `<div class="se-kartica" onclick="odpriPopup('${sid}')">
    ${plakat ? `<img class="se-kartica-slika" src="${ubegni(plakat)}" alt="" loading="lazy" onerror="slikaNiUspela(this)">`
             : '<div class="se-kartica-brez">📺</div>'}
    ${ocena}${znak}
    <div class="se-kartica-body">
      <div class="se-kartica-naslov">${ubegni(s.naslov)}</div>
      ${s.naslov_sl ? `<div class="se-kartica-sl">${ubegni(s.naslov_sl)}</div>` : ''}
      <div class="se-kartica-meta">${sezOpis}${sezOpis ? ' · ' : ''}${s.epizod} ${s.epizod === 1 ? 'epizoda' : 'epizod'}</div>
      ${naslednji}
    </div>
  </div>`;
}

// -----------------------------------------------------------------------------
// Popup: serija -> sezone -> epizode -> termini
// -----------------------------------------------------------------------------

function odpriPopup(sid, odpriSezono) {
  const s = SERIJE[sid];
  if (!s) return;
  odprtaSerija = sid;

  const plakat = document.getElementById('p-plakat');
  const vir = s.poster_tmdb || s.slika || '';
  plakat.onerror = () => { plakat.style.display = 'none'; };
  if (vir) { plakat.src = vir; plakat.style.display = ''; } else { plakat.style.display = 'none'; }

  document.getElementById('p-naslov').textContent = s.naslov;
  const pod = document.getElementById('p-podnaslov');
  pod.textContent = s.naslov_sl || '';
  pod.style.display = s.naslov_sl ? '' : 'none';

  const znacke = [];
  if (s.imdb_ocena) {
    znacke.push(`<span class="se-znacka se-znacka-imdb">IMDb ★ ${ubegni(s.imdb_ocena)}${
      s.imdb_glasovi ? ' · ' + Number(s.imdb_glasovi).toLocaleString('sl') + ' glasov' : ''}</span>`);
  }
  if (s.leto) znacke.push(`<span class="se-znacka">${ubegni(s.leto)}</span>`);
  if (s.sezon_vseh) znacke.push(`<span class="se-znacka">${s.sezon_vseh} sezon skupaj</span>`);
  (s.zanr || []).forEach(z => znacke.push(`<span class="se-znacka">${ubegni(z)}</span>`));
  document.getElementById('p-znacke').innerHTML = znacke.join('');

  document.getElementById('p-kanali').textContent =
    (s.kanali || []).join(', ') + ' · ' + s.terminov +
    (s.terminov === 1 ? ' termin' : ' terminov') + ' v oknu';

  const opis = document.getElementById('p-opis');
  opis.textContent = s.opis || '';
  opis.style.display = s.opis ? '' : 'none';

  // Privzeto odprta je sezona, v kateri je naslednja epizoda na sporedu.
  odprteSezone = new Set();
  if (odpriSezono != null) {
    odprteSezone.add(String(odpriSezono));
  } else {
    const t = naslednjiTermin(sid);
    const e = t ? EPIZODE[t.ep] : null;
    if (e) odprteSezone.add(String(e.s));
  }

  izrisiSezone();
  document.getElementById('overlay').classList.add('active');
  document.getElementById('popup').classList.add('active');
}

function izrisiSezone() {
  const sid = odprtaSerija;
  if (!sid) return;
  const eids = (EPIZODE_SER[sid] || []).slice();

  const poSezoni = {};
  eids.forEach(eid => {
    const e = EPIZODE[eid];
    const kljuc = String(e.s == null ? 'x' : e.s);
    (poSezoni[kljuc] = poSezoni[kljuc] || []).push(eid);
  });

  const kljuci = Object.keys(poSezoni).sort((a, b) => {
    if (a === 'x') return 1;
    if (b === 'x') return -1;
    return Number(a) - Number(b);
  });

  document.getElementById('p-sezone').innerHTML = kljuci.map(k => {
    const seznam = poSezoni[k].sort((a, b) => (EPIZODE[a].e || 0) - (EPIZODE[b].e || 0));
    const odprta = odprteSezone.has(k);
    const ime = k === 'x' ? 'Brez oznake sezone'
      : (k === '0' ? 'Posebne oddaje (sezona 0)' : 'Sezona ' + k);
    return `<div class="se-sezona ${odprta ? 'odprta' : ''}">
      <div class="se-sezona-glava" onclick="preklopiSezono('${k}')">
        <span class="se-sezona-caret">${odprta ? '▾' : '▸'}</span>
        <span class="se-sezona-ime">${ime}</span>
        <span class="se-sezona-stev">${seznam.length} ${seznam.length === 1 ? 'epizoda' : 'epizod'} na sporedu</span>
      </div>
      <div class="se-sezona-telo">${seznam.map(epizodaHtml).join('')}</div>
    </div>`;
  }).join('');
}

function preklopiSezono(k) {
  odprteSezone.has(k) ? odprteSezone.delete(k) : odprteSezone.add(k);
  izrisiSezone();
}

function epizodaHtml(eid) {
  const e = EPIZODE[eid];
  const oznake = [];
  if (e.zacetek === 'serija') oznake.push('<span class="se-oznaka se-o-prva">začetek serije</span>');
  else if (e.zacetek === 'sezona') oznake.push('<span class="se-oznaka se-o-zacetek">začetek sezone</span>');
  // `sporno` pomeni, da si EPG pri tej epizodi sam nasprotuje (dva naslova za
  // isto številko). Skrivati tega ne kaže — gledalec naj ve, da je vir zmeden.
  if (e.sporno) oznake.push('<span class="se-oznaka se-o-sporno">vir ni enoten</span>');

  const termini = (TERMINI_EP[eid] || []).map(t => {
    const st = statusTermina(t);
    const oz = st === 'zdaj' ? '<span class="se-oznaka se-o-zdaj">zdaj</span>'
      : (!t.prvi ? '<span class="se-oznaka se-o-ponovitev">ponovitev</span>' : '');
    return `<div class="se-termin ${st === 'bilo' ? 'bilo' : ''}">
      <span>${imeDneva(t.datum)} ${datumKratko(t.datum)}, ${uraIz(t.zac)}</span>
      <span class="se-termin-kanal">${ubegni(t.k)}</span>${oz}
    </div>`;
  }).join('');

  const naslov = e.naslov || e.naslov_sl || '(brez naslova)';
  return `<div class="se-epizoda">
    <div class="se-epizoda-vrh">
      <span class="se-epizoda-st">${oznakaEpizode(e) || '—'}</span>
      <span class="se-epizoda-naslov">${ubegni(naslov)}</span>
      ${e.naslov_sl && e.naslov ? `<span class="se-epizoda-sl">${ubegni(e.naslov_sl)}</span>` : ''}
      ${oznake.join('')}
    </div>
    <div class="se-epizoda-termini">${termini}</div>
  </div>`;
}

function zapriPopup() {
  odprtaSerija = null;
  document.getElementById('overlay').classList.remove('active');
  document.getElementById('popup').classList.remove('active');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { zapriPopup(); }
});

init();
</script>

</html>
