        onclick="preklopiZanr('${ubegni(z.ime)}')">${ubegni(z.ime)}<span class="se-btn-stevec">${z.serij}</span></button>`
    ).join('');
}

/* Gumba za kanale in žanre. Ker je seznam zaprt, mora gumb sam povedati, ali
   filter deluje — sicer bi uporabnik gledal skrajšan seznam serij in ne bi
   vedel, zakaj. */
function izrisiCta() {
  const opis = (mnozica, praznoBesedilo) =>
    mnozica.size === 0 ? praznoBesedilo
      : (mnozica.size === 1 ? [...mnozica][0] : mnozica.size + ' izbranih');
  const gumb = (id, ime, mnozica, prazno) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('active', mnozica.size > 0);
    el.classList.toggle('odprt', odprtPanel === id.replace('cta-', ''));
    el.innerHTML = `${ime} <span class="se-cta-stanje">${ubegni(opis(mnozica, prazno))}</span>
                    <span class="se-cta-pusc">${odprtPanel === id.replace('cta-', '') ? '▴' : '▾'}</span>`;
  };
  gumb('cta-zanri', 'Žanri', izbraniZanri, 'vsi');
}

/* Kanali imajo od 24.8.2026 svojo vrstico na vrhu strani — enako obliko kot
   filmi in sport. Stanje ostane loceno po vejah; skupna je samo oblika.
   META.kanali ze vsebuje SAMO kanale, ki v tej veji kaj imajo, zato tu ni
   cesa filtrirati. */
function posodobiKanaliBar() {
  const kan = (META.kanali || []).filter(k => k.serij);
  const vsi = izbraniKanali.size === 0;

  const cta = document.getElementById('kanali-cta');
  if (cta) {
    cta.innerHTML = `IZBRANI KANALI: ${vsi ? kan.length : izbraniKanali.size}${vsi ? ' (VSI)' : ''}` +
                    `<span class="kanali-cta-pusc">${kanalPanelOdprt ? '&#9652;' : '&#9662;'}</span>`;
  }

  const panel = document.getElementById('kanali-panel');
  if (!panel) return;
  panel.style.display = kanalPanelOdprt ? 'flex' : 'none';
  panel.innerHTML =
    `<button class="f-btn ${vsi ? 'active' : ''}" onclick="pocistiKanale()">Vsi kanali</button>` +
    kan.map(k => {
      const izb = izbraniKanali.has(k.ime);
      // Zadnjega izbranega kanala ni mogoce odkliniti — sicer bi ostal prazen izbor.
      const zadnji = izbraniKanali.size === 1 && izb;
      return `<button class="f-btn ${izb ? 'active' : ''}${zadnji ? ' zaklenjen' : ''}"
              ${zadnji ? 'disabled title="Vsaj en kanal mora ostati izbran"' : ''}
              onclick="preklopiKanal('${ubegni(k.ime)}')">${ubegni(k.ime)}<span class="f-btn-stevec">${k.serij}</span></button>`;
    }).join('');
}

function preklopiKanalPanel() {
  kanalPanelOdprt = !kanalPanelOdprt;
  posodobiKanaliBar();
}

/* Piluli "Začetek serije" / "Začetek sezone" (25.8.2026). Slog je isti `.se-btn`
   kot žanri in razvrstitve — stran nikjer nima pravih kljukic in Andrej je hotel
   enotnost. Števec pove, koliko serij pilula prinese; brez njega bi uporabnik
   klikal na slepo. Šteje se po ISTI časovnici kot oznake v mreži. */
const ZACETKI_FILTER = [
  ['serija', 'Začetek serije'],
  ['sezona', 'Začetek sezone'],
];

function izrisiZacetkiFilter() {
  const el = document.getElementById('f-zacetki');
  if (!el) return;
  el.innerHTML = ZACETKI_FILTER.map(([k, t]) => {
    const n = Object.keys(SERIJE).filter(sid => imaZacetek(sid, k)).length;
    return `<button class="se-btn ${izbraniZacetki.has(k) ? 'active' : ''}"
            onclick="preklopiZacetek('${k}')">${t}<span class="se-btn-stevec">${n}</span></button>`;
  }).join('');
}

function preklopiZacetek(k) {
  izbraniZacetki.has(k) ? izbraniZacetki.delete(k) : izbraniZacetki.add(k);
  stranIdx = 0; izrisiFiltre(); izrisiMrezo();
}

/* Ocena: drsnik kot na filmski strani, na koncu gumb "Brez ocene".
   Serije brez IMDb ocene pri drsniku nad 0 izpadejo — to je namen; kdor jih
   išče, ima za to svoj gumb. */
function izrisiOceno() {
  const el = document.getElementById('se-ocena');
  if (!el) return;
  el.innerHTML = `
    <span class="filter-label">Ocena</span>
    <div class="slider-wrap active${brezOcene ? ' onemogocen' : ''}">
      <span class="se-slider-ime">IMDb</span>
      <input type="range" min="0" max="9" step="0.5" value="${imdbMin}"
             ${brezOcene ? 'disabled' : ''} oninput="nastaviImdbMin(this.value)">
      <span class="slider-val">${imdbMin > 0 ? imdbMin + '+' : 'vse'}</span>
    </div>
    <button class="se-btn ${brezOcene ? 'active' : ''}" onclick="preklopiBrezOcene()">Brez ocene</button>`;
}

function preklopiPanel(kaj) {
  odprtPanel = (odprtPanel === kaj) ? null : kaj;
  ['zanri'].forEach(k => {
    const p = document.getElementById('panel-' + k);
    if (p) p.style.display = (odprtPanel === k) ? '' : 'none';
  });
  izrisiCta();
}

function nastaviRazvrstitev(k) { razvrstitev = k; stranIdx = 0; izrisiFiltre(); izrisiMrezo(); }

function nastaviImdbMin(v) {
  imdbMin = parseFloat(v);
  brezOcene = false;
  stranIdx = 0;
  // Med vlečenjem drsnika se ne izrisuje cel filter — samo številka poleg njega,
  // sicer bi se element pod prstom sproti na novo ustvarjal.
  const el = document.querySelector('#se-ocena .slider-val');
  if (el) el.textContent = imdbMin > 0 ? imdbMin + '+' : 'vse';
  izrisiMrezo();
}

function preklopiBrezOcene() {
  brezOcene = !brezOcene;
  if (brezOcene) imdbMin = 0;
  stranIdx = 0;
  izrisiOceno();
  izrisiMrezo();
}

function pocistiKanale() { izbraniKanali.clear(); stranIdx = 0; izrisiFiltre(); izrisiMrezo(); }
function preklopiKanal(k) {
  if (izbraniKanali.has(k)) {
    if (izbraniKanali.size === 1) return;   // zadnji izbrani ostane
    izbraniKanali.delete(k);
  } else {
    izbraniKanali.add(k);
  }
  stranIdx = 0; izrisiFiltre(); izrisiMrezo();
}
function pocistiZanre() { izbraniZanri.clear(); stranIdx = 0; izrisiFiltre(); izrisiMrezo(); }
function preklopiZanr(z) {
  izbraniZanri.has(z) ? izbraniZanri.delete(z) : izbraniZanri.add(z);
  stranIdx = 0; izrisiFiltre(); izrisiMrezo();
}

/* Nacin iskanja — enaka dva gumba kot pri filmih. Privzeto "Samo naziv":
   iskanje po opisih vrne prevec sirok rezultat, kdor ga hoce, ga vklopi. */
function izberIskanjeNacin(nacin) {
  iskanjeNacin = nacin;
  document.getElementById('iskanje-btn-naziv').classList.toggle('active', nacin === 'naziv');
  document.getElementById('iskanje-btn-vse').classList.toggle('active', nacin === 'vse');
  document.getElementById('se-iskanje').placeholder =
    nacin === 'naziv' ? 'Išči serijo po naslovu…' : 'Išči serijo, epizodo, igralca v opisu…';
  stranIdx = 0;
  izrisiMrezo();
}

function onIskanje() {
  query = document.getElementById('se-iskanje').value.trim().toLowerCase();
  document.getElementById('se-iskanje-clear').style.display = query ? '' : 'none';
  stranIdx = 0;
  izrisiMrezo();
}

function pocistiIskanje() {
  document.getElementById('se-iskanje').value = '';
  query = '';
  document.getElementById('se-iskanje-clear').style.display = 'none';
  stranIdx = 0;
  izrisiMrezo();
}

// -----------------------------------------------------------------------------
// Mreža serij
// -----------------------------------------------------------------------------

/* Iskanje gre čez izvirni naslov, slovenskega, naslov s TMDb in čez naslove
   epizod — kdor se spomni samo epizode ("Striptizeta"), mora najti serijo. */
function besediloSerije(sid) {
  const s = SERIJE[sid];
  // "Samo naziv" isce po imenih serije — treh, ker je isto ime lahko izvirno,
  // slovensko ali s TMDb. Naslovi EPIZOD sodijo sem, ker se gledalec pogosto
  // spomni samo epizode ("Striptizeta") in mora tako najti serijo.
  const imena = [s.naslov, s.naslov_sl, s.naslov_tmdb];
  (EPIZODE_SER[sid] || []).forEach(eid => {
    const e = EPIZODE[eid];
    imena.push(e.naslov, e.naslov_sl);
  });
  if (iskanjeNacin === 'naziv') return imena.join(' ').toLowerCase();

  return imena.concat([(s.zanr || []).join(' '),
                       (s.kanali || []).join(' '),
                       s.opis || '']).join(' ').toLowerCase();
}

function ustreza(sid) {
  const s = SERIJE[sid];
  if (izbraniKanali.size && !(s.kanali || []).some(k => izbraniKanali.has(k))) return false;
  if (izbraniZanri.size && !(s.zanr || []).some(z => izbraniZanri.has(z))) return false;
  // Piluli sta OR: neoznačeni pomenita "brez filtra", obe označeni pa serije,
  // ki imajo katerikoli začetek. Prazen izbor NIKOLI ne pomeni praznega seznama.
  if (izbraniZacetki.size && ![...izbraniZacetki].some(v => imaZacetek(sid, v))) return false;

  const ocena = parseFloat(s.imdb_ocena);
  if (brezOcene) { if (!isNaN(ocena)) return false; }
  else if (imdbMin > 0 && !(ocena >= imdbMin)) return false;

  if (query && !besediloSerije(sid).includes(query)) return false;
  return true;
}

function urejeneSerije() {
  const seznam = Object.keys(SERIJE).filter(ustreza);
  const kljuc = {
    ocena: sid => -(parseFloat(SERIJE[sid].imdb_ocena) || 0),
    epizod: sid => -(SERIJE[sid].epizod || 0),
    abeceda: sid => SERIJE[sid].naslov.toLowerCase(),
    kmalu: sid => { const t = naslednjiTermin(sid); return t ? t.zac : Infinity; },
  }[razvrstitev];

  return seznam.sort((a, b) => {
    const ka = kljuc(a), kb = kljuc(b);
    if (ka < kb) return -1;
    if (ka > kb) return 1;
    return SERIJE[a].naslov.localeCompare(SERIJE[b].naslov, 'sl');
  });
}

function izrisiMrezo() {
  const seznam = urejeneSerije();
  const info = document.getElementById('se-info');
  const cilj = document.getElementById('se-mreza');
  const strani = Math.max(1, Math.ceil(seznam.length / NA_STRAN));
  if (stranIdx >= strani) stranIdx = strani - 1;

  info.textContent = seznam.length + (seznam.length === 1 ? ' serija' : ' serij') +
    ' · ' + TERMINI.length + ' terminov v oknu';

  if (!seznam.length) {
    cilj.innerHTML = '<div class="se-prazno">Za izbrane filtre ni serij.</div>';
    document.getElementById('se-paginacija').style.display = 'none';
    return;
  }

  const odsek = seznam.slice(stranIdx * NA_STRAN, (stranIdx + 1) * NA_STRAN);
  cilj.innerHTML = odsek.map(karticaHtml).join('');

  const pag = document.getElementById('se-paginacija');
  pag.style.display = strani > 1 ? '' : 'none';
  document.getElementById('pag-info').textContent = `${stranIdx + 1} / ${strani}`;
  document.getElementById('pag-prej').disabled = stranIdx === 0;
  document.getElementById('pag-nasl').disabled = stranIdx >= strani - 1;
}

function stran(korak) {
  stranIdx += korak;
  izrisiMrezo();
  window.scrollTo({ top: document.querySelector('.main').offsetTop - 10, behavior: 'smooth' });
}

/* Ali serija v oknu ponuja začetek sezone ali serije — edina oznaka na kartici,
   ker je za gledalca najbolj uporabna informacija.

   Šteje CELO okno, ne le prihodnjih terminov: prva epizoda, ki je bila pred
   petimi dnevi, je še vedno v arhivu in gledalec lahko z njo začne. Prej je
   ta funkcija gledala samo naprej in serije kot Taboo so ostale brez oznake.

   "Začetek serije" (S01E01) prevlada nad "novo sezono" — kdor lahko začne čisto
   od začetka, ga sredina serije ne zanima. */
/* Ali je ta začetek znotraj ene same časovnice, ki velja za VSO stran:
   najbližji prihodnji termin je največ ZACETKI_OKNO pred nami, ali pa je zadnji
   pretekli največ ZACETKI_OKNO za nami. Tu je edino mesto, kjer je to pravilo
   zapisano — oddelek, oznake v mreži in piluli ga vsi berejo od tod. */
function zacetekVCasovnici(termini, n) {
  const t = termini.find(x => x.kon >= n);
  if (t) return t.zac - n <= ZACETKI_OKNO;
  const zadnji = termini[termini.length - 1];
  return !!zadnji && n - zadnji.zac <= ZACETKI_OKNO;
}

/* Ali ima serija v časovnici začetek dane vrste ('serija' | 'sezona').
   Bere PODATKE, ne oznake: serija, ki ima oboje, nosi zlato oznako, a se pri
   piluli "Začetek sezone" vseeno pokaže — Andrejeva odločitev 25.8.2026
   (resnica pred videzom, takih je 5). */
function imaZacetek(sid, vrsta) {
  const n = zdaj();
  return (EPIZODE_SER[sid] || []).some(eid => {
    const e = EPIZODE[eid];
    if (e.zacetek !== vrsta) return false;
    const termini = TERMINI_EP[eid] || [];
    return termini.length > 0 && zacetekVCasovnici(termini, n);
  });
}

/* 25.8.2026: oznaka v mreži uporablja ISTO ČASOVNICO kot oddelek "Ujemi
   začetek" — strogih ZACETKI_OKNO (7x24 h) nazaj in naprej. Prej je štelo celo
   podatkovno okno (~14 dni) in je nastal par, ki si je nasprotoval: Taboo je
   imel v mreži zlato oznako, v oddelku pa ga ni bilo. Andrejeva zahteva:
   ena časovnica povsod. Učinek je majhen (3 serije izgubijo oznako, nobena je
   ne zamenja), ker je podatkovno okno tako ali tako približno ±7 dni. */
function zacetekVOknu(sid) {
  const n = zdaj();
  let serija = false, sezona = null, sezonaTeza = -Infinity;
  (EPIZODE_SER[sid] || []).forEach(eid => {
    const e = EPIZODE[eid];
    if (!e.zacetek) return;
    const termini = TERMINI_EP[eid] || [];
    if (!termini.length) return;
    if (!zacetekVCasovnici(termini, n)) return;
    if (e.zacetek === 'serija') { serija = true; return; }
    // Če ima serija več začetkov sezon, obvelja tisti, ki je časovno najbližje
    // zdaj: najprej najbližji prihodnji, sicer najsvežejši pretekli.
    const t = termini.find(x => x.kon >= n) || termini[termini.length - 1];
    const teza = t.kon >= n ? 1e12 - t.zac : t.zac;
    if (teza > sezonaTeza) { sezonaTeza = teza; sezona = e.s; }
  });
  if (serija) return { vrsta: 'serija' };
  if (sezona != null) return { vrsta: 'sezona', s: sezona };
  return null;
}

function karticaHtml(sid) {
  const s = SERIJE[sid];
  const plakat = s.poster_tmdb || s.slika || '';
  const ocena = s.imdb_ocena ? `<span class="se-kartica-ocena">★ ${ubegni(s.imdb_ocena)}</span>` : '';
  const zac = zacetekVOknu(sid);
  const znak = zac
    ? `<span class="se-kartica-znak ${zac.vrsta === 'serija' ? 'prva' : ''}">${
        zac.vrsta === 'serija' ? 'ZAČETEK SERIJE' : 'NOVA SEZONA ' + zac.s}</span>` : '';
  const sezone = (s.sezone || []);
  const sezOpis = sezone.length === 0 ? ''
    : sezone.length === 1 ? 'sezona ' + sezone[0]
      : 'sezone ' + sezone[0] + '–' + sezone[sezone.length - 1];
  const t = naslednjiTermin(sid);
  const naslednji = t
    ? `<div class="se-kartica-nasl-termin">${imeDneva(t.datum)} ${uraIz(t.zac)} · ${ubegni(t.k)}</div>`
    : '<div class="se-kartica-nasl-termin" style="color:#5c5870">ni več na sporedu</div>';

  return `<div class="se-kartica" onclick="odpriPopup('${sid}')">
    ${plakat ? `<img class="se-kartica-slika" src="${ubegni(plakat)}" alt="" loading="lazy" onerror="slikaNiUspela(this)">`
             : '<div class="se-kartica-brez">📺</div>'}
    ${ocena}${znak}
    <div class="se-kartica-body">
      <div class="se-kartica-naslov">${ubegni(s.naslov)}</div>
      ${s.naslov_sl ? `<div class="se-kartica-sl">${ubegni(s.naslov_sl)}</div>` : ''}
      <div class="se-kartica-meta">${sezOpis}${sezOpis ? ' · ' : ''}${s.epizod} ${s.epizod === 1 ? 'epizoda' : 'epizod'}</div>
      ${naslednji}
    </div>
  </div>`;
}

// -----------------------------------------------------------------------------
// Popup: serija -> sezone -> epizode -> termini
// -----------------------------------------------------------------------------

function odpriPopup(sid, odpriSezono) {
  const s = SERIJE[sid];
  if (!s) return;
  odprtaSerija = sid;

  const plakat = document.getElementById('p-plakat');
  const ovoj = document.getElementById('p-plakat-ovoj');
  const vir = s.poster_tmdb || s.slika || '';
  // Skrije se OVOJ, ne slika — sicer bi na mestu plakata ostal namig za povecavo.
  plakat.onerror = () => { ovoj.style.display = 'none'; };
  if (vir) { plakat.src = vir; ovoj.style.display = ''; } else { ovoj.style.display = 'none'; }

  document.getElementById('p-naslov').textContent = s.naslov;
  const pod = document.getElementById('p-podnaslov');
  pod.textContent = s.naslov_sl || '';
  pod.style.display = s.naslov_sl ? '' : 'none';

  const znacke = [];
  if (s.imdb_ocena) {
    znacke.push(`<span class="se-znacka se-znacka-imdb">IMDb ★ ${ubegni(s.imdb_ocena)}${
      s.imdb_glasovi ? ' · ' + Number(s.imdb_glasovi).toLocaleString('sl') + ' glasov' : ''}</span>`);
  }
  if (s.leto) znacke.push(`<span class="se-znacka">${ubegni(s.leto)}</span>`);
  if (s.sezon_vseh) znacke.push(`<span class="se-znacka">${s.sezon_vseh} sezon skupaj</span>`);
  (s.zanr || []).forEach(z => znacke.push(`<span class="se-znacka">${ubegni(z)}</span>`));
  document.getElementById('p-znacke').innerHTML = znacke.join('');

  document.getElementById('p-kanali').textContent =
    (s.kanali || []).join(', ') + ' · ' + s.terminov +
    (s.terminov === 1 ? ' termin' : ' terminov') + ' v oknu';

  const opis = document.getElementById('p-opis');
  opis.textContent = s.opis || '';
  opis.style.display = s.opis ? '' : 'none';

  // Privzeto odprta je sezona, v kateri je naslednja epizoda na sporedu.
  odprteSezone = new Set();
  if (odpriSezono != null) {
    odprteSezone.add(String(odpriSezono));
  } else {
    const t = naslednjiTermin(sid);
    const e = t ? EPIZODE[t.ep] : null;
    if (e) odprteSezone.add(String(e.s));
  }

  izrisiSezone();
  document.getElementById('overlay').classList.add('active');
  document.getElementById('popup').classList.add('active');
}

function izrisiSezone() {
  const sid = odprtaSerija;
  if (!sid) return;
  const eids = (EPIZODE_SER[sid] || []).slice();

  const poSezoni = {};
  eids.forEach(eid => {
    const e = EPIZODE[eid];
    const kljuc = String(e.s == null ? 'x' : e.s);
    (poSezoni[kljuc] = poSezoni[kljuc] || []).push(eid);
  });

  const kljuci = Object.keys(poSezoni).sort((a, b) => {
    if (a === 'x') return 1;
    if (b === 'x') return -1;
    return Number(a) - Number(b);
  });

  document.getElementById('p-sezone').innerHTML = kljuci.map(k => {
    const seznam = poSezoni[k].sort((a, b) => (EPIZODE[a].e || 0) - (EPIZODE[b].e || 0));
    const odprta = odprteSezone.has(k);
    const ime = k === 'x' ? 'Brez oznake sezone'
      : (k === '0' ? 'Posebne oddaje (sezona 0)' : 'Sezona ' + k);
    return `<div class="se-sezona ${odprta ? 'odprta' : ''}">
      <div class="se-sezona-glava" onclick="preklopiSezono('${k}')">
        <span class="se-sezona-caret">${odprta ? '▾' : '▸'}</span>
        <span class="se-sezona-ime">${ime}</span>
        <span class="se-sezona-stev">${seznam.length} ${seznam.length === 1 ? 'epizoda' : 'epizod'} na sporedu</span>
      </div>
      <div class="se-sezona-telo">${seznam.map(epizodaHtml).join('')}</div>
    </div>`;
  }).join('');
}

function preklopiSezono(k) {
  odprteSezone.has(k) ? odprteSezone.delete(k) : odprteSezone.add(k);
  izrisiSezone();
}

function epizodaHtml(eid) {
  const e = EPIZODE[eid];
  const oznake = [];
  if (e.zacetek === 'serija') oznake.push('<span class="se-oznaka se-o-prva">začetek serije</span>');
  else if (e.zacetek === 'sezona') oznake.push(
    `<span class="se-oznaka se-o-zacetek">nova sezona ${e.s}</span>`);
  // `sporno` pomeni, da si EPG pri tej epizodi sam nasprotuje (dva naslova za
  // isto številko). Skrivati tega ne kaže — gledalec naj ve, da je vir zmeden.
  if (e.sporno) oznake.push('<span class="se-oznaka se-o-sporno">vir ni enoten</span>');

  const termini = (TERMINI_EP[eid] || []).map(t => {
    const st = statusTermina(t);
    const oz = st === 'zdaj' ? '<span class="se-oznaka se-o-zdaj">zdaj</span>'
      : (!t.prvi ? '<span class="se-oznaka se-o-ponovitev">ponovitev</span>' : '');
    return `<div class="se-termin ${st === 'bilo' ? 'bilo' : ''}">
      <span>${imeDneva(t.datum)} ${datumKratko(t.datum)}, ${uraIz(t.zac)}</span>
      <span class="se-termin-kanal">${ubegni(t.k)}</span>${oz}
    </div>`;
  }).join('');

  const naslov = e.naslov || e.naslov_sl || '(brez naslova)';
  return `<div class="se-epizoda">
    <div class="se-epizoda-vrh">
      <span class="se-epizoda-st">${oznakaEpizode(e) || '—'}</span>
      <span class="se-epizoda-naslov">${ubegni(naslov)}</span>
      ${e.naslov_sl && e.naslov ? `<span class="se-epizoda-sl">${ubegni(e.naslov_sl)}</span>` : ''}
      ${oznake.join('')}
    </div>
    <div class="se-epizoda-termini">${termini}</div>
  </div>`;
}

/* Povecava plakata (24.8.2026) — enako kot pri filmih. */
function odpriSlikoLightbox() {
  const src = document.getElementById('p-plakat').src;
  if (!src) return;
  document.getElementById('slika-lightbox-img').src = src;
  document.getElementById('slika-lightbox').classList.add('active');
}
function zapriSlikoLightbox() {
  document.getElementById('slika-lightbox').classList.remove('active');
}

function zapriPopup() {
  odprtaSerija = null;
  document.getElementById('overlay').classList.remove('active');
  document.getElementById('popup').classList.remove('active');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { zapriPopup(); }
});

init();
</script>
